# The pit game's target profile: the numbers an asset is checked against for that game.
#
# PROVISIONAL. Every field here is a placeholder until issue #11 fixes what a target
# profile holds and fills in budgets measured in Bevy. Do not read meaning into the numbers.

# Placeholder, not measured: the most triangles one asset may have.
triangle_budget = 20000

# Placeholder, not decided: the nearest a player's eye comes to an asset, in metres. One of
# the review pictures is taken from this far away. 0.5 m is what the budget measurement
# assumed (learn/research/pit-budget-measurement.md, section 2).
closest_viewing_distance = 0.5

# Placeholder, not decided: how many pixels each way the textures are that kiln bakes for an
# asset it has reduced. 2048 is where a larger texture stopped showing in the review pictures
# of two subjects (learn/research/blender-stages-trial.md, section 6). Textures that arrive
# on a model already inside the triangle budget are not resized or checked against this.
texture_size = 2048
