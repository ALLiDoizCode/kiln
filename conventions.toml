# Machine-readable project standards. Scripts in tools/ read this file; prose
# rationale lives in docs/adr/. Only put a value here if a script consumes it.

[toolchain]
# Must match tools/install_tools.sh and Cargo.toml.
blender = "5.2.2"
bevy = "0.19.1"
gltf_validator = "2.0.0-dev.3.10"

[naming]
# Objects, mesh data and materials. Blender's "Cube.001"-style defaults fail this.
pattern = "^[a-z][a-z0-9_]*$"
material_prefix = "m_"

[mesh]
max_face_sides = 4          # no n-gons in delivery meshes
merge_distance_m = 0.00001  # vertices closer than this are duplicates
min_face_area_m2 = 1e-10

[planes]
# How flat-surfaced assets (rock, ADR 9) are measured; the amounts wanted are in each spec.
coplanar_deg = 1.0          # faces within this of their group's mean normal form one plane
ledge_min_deg = 30.0        # two planes must differ by at least this to form a ledge
# Where a shape is looked at from when a spec limits what one view may show: the review
# cameras, the side they leave out, and the three-quarter opposite the Bevy tile's.
views = ["front", "right", "back", "left", "top", "three_quarter", "three_quarter_back"]
view_rays = 128             # parallel rays across the wider side of each view

[fullness]
# The crown is the level slice through an asset this share of the way up its bounds.
crown_height = 0.75

[pieces]
# How a shape built of several pieces (docs/style/rock-shapes.md) is held to what its build recorded.
on_plane_m = 0.003          # a mesh face this close to a recorded piece's face lies on it
grid = 24                   # points along each side of the bounds where the mesh and the pieces are compared
max_mismatch = 0.04         # share of the space they fill where the two may differ; soft edges take about 0.02
min_owned_share = 0.7       # share of the visible surface that lies on a recorded piece; the rest is soft edge

[foot]
# A foot is near-level surface low on a shape that nothing stands over, seen from straight above.
band = 0.3                  # below this share of the height; the benchmark rock's weaker side reads 0.15 m2 here
level_normal_z = 0.7        # within 45 degrees of level: a top, not a leaning wall

[lean]
upright_deg = 8.0           # a side within this of vertical is upright; the benchmark rock has 0.145 of its sides there
side_normal_z = 0.7071      # faces steeper than 45 degrees are sides
summit_height = 0.9         # the summit is what stands above this share of the height

[transform]
tolerance = 0.00001         # rotation must be 0 and scale 1 within this

[gltf_profile]
# What bevy_gltf 0.19.1 can load; re-derive at every Bevy upgrade (ADR 0004).
allowed_extensions = [
  "KHR_lights_punctual",
  "KHR_materials_emissive_strength",
  "KHR_materials_ior",
  "KHR_materials_transmission",
  "KHR_materials_unlit",
  "KHR_materials_volume",
  "KHR_texture_transform",
]
max_joints = 256
# Image decoders compiled into crates/asset_smoke and crates/asset_view.
image_mime_types = ["image/png"]

[metrics]
# From the game target (ADR 7).
player_height_m = 1.8

[review]
tile_px = 512
eevee_samples = 32
# "scale" is the front view pulled back to include a player-height figure.
views = ["front", "right", "back", "top", "three_quarter", "scale"]
# Largest RMSE (0..1) between a rebuilt contact sheet and its approved baseline.
baseline_rmse = 0.01

[painted_shading]
# How tools/paint.py unwraps and bakes, and what the Bevy load test holds the
# result to (ADR 10). What an asset wants painted is in its spec.
unwrap_angle_deg = 66.0     # faces within this of each other unwrap as one island
island_gap_px = 8           # between islands; half of it is filled with bled colour
bake_samples = 16           # Cycles samples per texel
# Seen from 0.5 m (ADR 7) a texel at this density is 1 cm, about 1 degree across. Painted
# shading has no detail finer than an edge-light band a few centimetres wide, and the
# sampler blends neighbouring texels, so 1 cm texels do not show as blocks.
min_texels_per_m = 100
min_uv_coverage = 0.4       # share of the texture the triangles use; the box packer reaches 0.43 on the rock
max_uv_overlap = 0.001      # share of used texels claimed by more than one triangle
# Brightest channel of any texel, 8-bit sRGB. Outside this a surface clips to black or white once lit.
texel_range_srgb = [30, 240]
feature_deg = 30.0          # two faces at least this far apart in tilt make an edge or a crevice
colour_tolerance = 0.08     # open faces: measured over (material colour times tint)
min_effect_share = 0.5      # share of edge_light, crevice_shadow, side_shade and growth_edges the measured zones must average
# Variation a spec may ask for. The upward part (z) of a face's normal decides what it gets.
side_shade_normal_z = [0.3, 0.7]    # at or below the first a face is a side and takes the whole side shade; at the second, none
side_shade_half_band = 0.35         # the shade is whole at mid height, and gone this share of the height above and below it
growth_up_normal_z = [0.82, 0.94]   # growth settles on faces within 20 degrees of level, and not on faces past 35
growth_cover = [0.5, 1.5]           # measured cover of level faces, over the growth_up asked for: patchy, neither bare nor carpeted
growth_patch_edges = 0.9            # least times growth starts or stops per growth_patch_m along a level face: the rock reads 1.32, and 0.60 with patches three times too large
blotch_spread = [1.0, 2.5]          # tone spread of open faces (10th to 90th percentile), over the blotch asked for
max_blotch_grain = 0.2              # mean tone step between neighbouring samples, over that spread: blotches are broad
max_level_gap = 3                   # largest run of unused 8-bit levels inside the range open faces span: more is banding
