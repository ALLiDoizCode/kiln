# Machine-readable project standards. Scripts in tools/ read this file; prose
# rationale lives in docs/adr/. Only put a value here if a script consumes it.

[toolchain]
# Must match tools/install_tools.sh and Cargo.toml.
blender = "5.2.2"
bevy = "0.19.1"
gltf_validator = "2.0.0-dev.3.10"

[naming]
# Objects, mesh data and materials. Blender's "Cube.001"-style defaults fail this.
pattern = "^[a-z][a-z0-9_]*$"
material_prefix = "m_"

[mesh]
max_face_sides = 4          # no n-gons in delivery meshes
merge_distance_m = 0.00001  # vertices closer than this are duplicates
min_face_area_m2 = 1e-10

[planes]
# How flat-surfaced assets (rock, ADR 9) are measured; the amounts wanted are in each spec.
coplanar_deg = 1.0          # faces within this of their group's mean normal form one plane
ledge_min_deg = 30.0        # two planes must differ by at least this to form a ledge
# Where a shape is looked at from when a spec limits what one view may show: the review
# cameras, the side they leave out, and the three-quarter opposite the Bevy tile's.
views = ["front", "right", "back", "left", "top", "three_quarter", "three_quarter_back"]
view_rays = 128             # parallel rays across the wider side of each view

[fullness]
# The crown is the level slice through an asset this share of the way up its bounds.
crown_height = 0.75

[pieces]
# How a shape built of several pieces (docs/style/rock-shapes.md) is held to what its build recorded.
on_plane_m = 0.003          # a mesh face this close to a recorded piece's face lies on it
grid = 24                   # points along each side of the bounds where the mesh and the pieces are compared
max_mismatch = 0.04         # share of the space they fill where the two may differ; soft edges take about 0.02
min_owned_share = 0.7       # share of the visible surface that lies on a recorded piece; the rest is soft edge

[overlap]
# A shape of several closed pieces that pass into each other (ADR 13), measured on the mesh.
grid = 96                   # surface samples are no further apart than the longest side of the bounds over this
in_front_m = 0.0001         # a point of a surface is buried when the space this far in front of it is inside another piece
min_join_share = 0.02       # two pieces are joined when this share of the smaller one's surface lies inside the other

[foot]
# A foot is near-level surface low on a shape that nothing stands over, seen from straight above.
band = 0.3                  # below this share of the height; the benchmark rock's weaker side reads 0.15 m2 here
level_normal_z = 0.7        # within 45 degrees of level: a top, not a leaning wall

[lean]
upright_deg = 8.0           # a side within this of vertical is upright; the benchmark rock has 0.145 of its sides there
side_normal_z = 0.7071      # faces steeper than 45 degrees are sides
summit_height = 0.9         # the summit is what stands above this share of the height

[top]
level_deg = 12.0            # a surface within this of level is one to stand on; a slab's cap tips up to 6 degrees

[cluster]
# A crag: leaning prisms of different heights on one base, with low blocks at its foot.
block_height = 0.3          # a piece lower than this share of the bounds' height is a block and not a prism: the height the foot's band stops at

[pile]
# A stack: flat stones piled one on another.
seat_deg = 20.0             # a stone rests on surface within this of level: a cap, not the chamfer round it

[table]
# A table rock: a cap held off the ground on narrow necks. The clearance wanted under the cap is in each spec.
neck_height = 0.5           # the necks are measured where a level cut passes this share of that clearance above the ground: above the blocks at their feet, below the cap

[spire]
# A stepped spire: tiers stacked like a telescope on a fluted base. What a spire wants of its tiers is in each spec.
foot_height = 0.02          # a tier's foot is the level cut this share of its own height above its bottom; the tier below is the piece that holds most of it
min_standing_share = 0.9    # share of a tier, cut just above the top of the tier below, that has that tier under it: nothing hangs off
cut_cells = 48              # a level cut through a piece is measured on a grid of this many cells along its wider side
flute_height = 0.6          # a side of a piece on the ground is a flute's when it is this share of the base's height from bottom to top,
flute_tall = 1.2            # this many times as tall as it is wide,
flute_shown = 0.5           # and at least this share of it is outside every other piece
flute_samples = 24          # points along the base's height where a side is tested for being shown
head_height = 0.85          # a tier's head is the level cut this share of the way up what shows of it: under its chamfers

[mass]
# A boulder: one convex mass with sloping flanks (source/boulder). The amounts wanted are in each spec.
grid = 64                   # upright columns across the wider side of the bounds, where the solid is measured
steep_deg = 20.0            # a side within this of vertical is a wall; the benchmark's three rocks have 0.54 to 0.83 of their sides there, the first boulder (source/rock) 0.95

[scatter]
# A group of separate stones lying together (source/rubble). The amounts wanted are in each spec.
touch_m = 0.01              # two stones touch when their surfaces come this near: about a degree seen from 0.5 m

[transform]
tolerance = 0.00001         # rotation must be 0 and scale 1 within this

[gltf_profile]
# What bevy_gltf 0.19.1 can load; re-derive at every Bevy upgrade (ADR 0004).
allowed_extensions = [
  "KHR_lights_punctual",
  "KHR_materials_emissive_strength",
  "KHR_materials_ior",
  "KHR_materials_specular",  # its factor only: its textures need the cargo feature pbr_specular_textures (ADR 4)
  "KHR_materials_transmission",
  "KHR_materials_unlit",
  "KHR_materials_volume",
  "KHR_texture_transform",
]
max_joints = 256
# Image decoders compiled into crates/asset_smoke and crates/asset_view.
image_mime_types = ["image/png"]

[metrics]
# From the game target (ADR 7).
player_height_m = 1.8
eye_height_m = 1.7          # where a trunk is stood beside (tools/export.py writes the place; crates/asset_view looks from it)

[review]
tile_px = 512
eevee_samples = 32
# "scale" is the front view pulled back to include a player-height figure.
views = ["front", "right", "back", "top", "three_quarter", "scale"]
# Largest RMSE (0..1) between a rebuilt contact sheet and its approved baseline.
baseline_rmse = 0.01

[painted_shading]
# How tools/paint.py unwraps and bakes, and what the Bevy load test holds the
# result to (ADR 10). What an asset wants painted is in its spec.
unwrap_angle_deg = 66.0     # faces within this of each other unwrap as one island
island_gap_px = 8           # between islands, and half of it to the texture's border; half of it is filled with bled colour
bake_samples = 16           # Cycles samples per texel
# Seen from 0.5 m (ADR 7) a texel at this density is 1 cm, about 1 degree across. Painted
# shading has no detail finer than an edge-light band a few centimetres wide, and the
# sampler blends neighbouring texels, so 1 cm texels do not show as blocks.
min_texels_per_m = 100
min_uv_coverage = 0.4       # share of the texture the triangles use; the painter's packer reaches 0.58 on the rock (0.43 when it packed boxes)
                            # on a palette-coloured asset (ADR 11): the share of the texture under the palette's strip that the painted parts use, the margin baked round each island counted
max_uv_overlap = 0.001      # share of used texels claimed by more than one triangle
# Brightest channel of any texel, 8-bit sRGB. Outside this a surface clips to black or white once lit.
texel_range_srgb = [30, 240]
feature_deg = 30.0          # two faces at least this far apart in tilt make an exposed edge
# What a crevice is, for the painter and for the load test alike. The painter's shadow is whole where this share of
# the sky above a face is hidden (weighted toward straight up, as its ambient occlusion weighs it); the load test
# measures the shadow beside a fold that hides as much at its own line: two faces tilted t apart hide (1 - cos t) / 2.
crevice_sky_hidden = 0.2    # a fold of 53 degrees, as in the corner of a ledge whose wall leans back; a shallower valley is shaded in part, and is neither crevice nor open face
join_sky_hidden = 0.06      # where pieces overlap (ADR 13), the sky another piece hides: 28 degrees. Two pieces often meet in a groove too open to hide a fifth of the sky
colour_tolerance = 0.08     # open faces: measured over (material colour times tint)
min_effect_share = 0.5      # share of edge_light, crevice_shadow, side_shade and growth_edges the measured zones must average
# Variation a spec may ask for. The upward part (z) of a face's normal decides what it gets.
side_shade_normal_z = [0.3, 0.7]    # at or below the first a face is a side and takes the whole side shade; at the second, none
side_shade_half_band = 0.35         # the shade is whole at mid height, and gone this share of the height above and below it
growth_up_normal_z = [0.82, 0.94]   # growth settles on faces within 20 degrees of level, and not on faces past 35
growth_cover = [0.5, 1.5]           # measured cover of level faces, over the growth_up asked for: patchy, neither bare nor carpeted
growth_patch_edges = 0.61           # least unlikeness in growth of two points of a level face a quarter to half of growth_patch_m apart, over that of two far apart: the rock reads 0.78, and 0.48 with patches three times too large; their geometric mean, as the 0.9 before it was of 1.32 and 0.60 crossings per patch along the texture's rows
blotch_spread = [1.0, 2.5]          # tone spread of open faces (10th to 90th percentile), over the blotch asked for
max_blotch_grain = 0.2              # mean tone step between neighbouring samples, over that spread: blotches are broad
max_level_gap = 3                   # largest run of 8-bit levels no open face uses that two neighbouring texels of one face step over: more is banding
# Grain (ADR 12), measured where a spec gives close_height_m: on the upright faces below it.
grain_patch_m = 0.15                # a hand-sized patch: grain is asked of each one, not of the trunk on average
min_grain_step = 0.25               # mean tone step half a grain width across the grain, over the grain asked for
min_grain_along = 1.16              # that step, over the step the same distance along the grain: the least the benchmark trees show from 0.5 m (tools/view_checks.py)
min_grain_patches = 0.8             # share of patches that must show both

[shade]
# Gate L4d: a painted solid's sides turned away from the viewer's sun, in the viewer's own picture
# (asset_view --back --close --shade). Only the ambient light reaches them.
min_luminance = 0.0543      # their median, linear: Rock_Medium_1 of the benchmark reads 0.05430 from the same camera under the viewer's light (ambient 900), and its pebble 0.0650. Measure it again when that light changes
min_pixels = 200            # of the 65,536 sampled; the benchmark rock shows 6,680

[foliage]
# How leaf pieces take their colour (ADR 11). What a tree wants of its foliage is in its spec.
swatch_px = 8               # side of one palette swatch, texels; a piece's UVs sit on its middle
flat_m = 0.001              # a piece is flat when no corner is further than this from its plane
pointed_deg = 60.0          # and pointed when its sharpest corner is at most this
# Where a canopy is looked at from when a spec says how much sky shows through it, or how much
# branch: the level review cameras, the side they leave out, and the two three-quarter views.
views = ["front", "right", "back", "left", "three_quarter", "three_quarter_back"]
view_rays = 96              # parallel rays across the wider side of each view
max_palette_error = 0.02    # how far a piece's colour may be from the nearest palette colour, per channel (linear)
min_neighbours_differ = 0.5 # share of pieces whose nearest piece is another colour
# Looking straight up into a canopy, as a player under it does (the checks under_closed and under_rim).
below_cell_m = 0.05         # one ray per square of this size
seen_into_m = 0.6           # a piece met this far above a pad's underside is the inside of the pad
hole_m = 0.15               # gaps in a pad's outline up to this wide are holes in it, not its edge
rim_step_m = 0.05           # a point stands clear when there is sky this far past it and either side of it
core_min_triangles = 12     # an open part of the foliage material with this many triangles is a core with a hole, not a leaf piece

[discs]
# A group of discs floating at one level (source/lily_pad). What a group wants of its discs is in each spec.
twin = 1.1                  # two discs are twins when the wider is less than this many times the narrower

[mat]
# A mat of leaves lying on the ground (source/leaf_mat). What a mat wants is in each spec.
cell_m = 0.01               # what its leaves cover, seen from above, is counted on a grid of squares this size

[under_view]
# A tree's canopy as a player under it sees it (tools/under_checks.py, gate L4e). The picture is the
# gate's `bevy_under` tile; tools/gate.sh takes it from the same place.
stand_m = 1.0               # the eye's distance from the trunk
pitch_deg = 78.0            # and how far above level it looks
min_samples = 300           # samples of sky, of leaf pieces and of bark the view must hold to be measured
min_agree = 0.9             # share of the samples at which the picture and the rays agree on sky or tree
pale_light = 2.0            # a leaf sample is pale when it is this many times lighter than the typical unlit piece, and nearer grey than the palette allows
max_pale_share = 0.0002     # share of the leaf samples that may be pale: glare, not a leaf's colour

[palette]
# Variants that are a change of palette on their base asset's mesh (ADR 11, ADR 13).
# "dry" is not one of the year's: it is how grass and reeds stand after a drought, whatever the month (the catalogue's "tall dry grass").
seasons = ["summer", "autumn", "winter", "dry"]
# What a season's spec may change from its base's, besides its materials' colours
# (tools/lint_spec.py); everything else shapes the mesh or its UVs and must be the base's.
keys = ["foliage.under_tint", "foliage.top_tint", "foliage.core_tint", "foliage.variation", "painted_shading.base_tint", "painted_shading.top_tint"]
# What lies on a stone (docs/style/catalogue.md). A cover other than bare is growth (ADR 10), and a
# cover variant's spec may change only these from its base's: where the growth sits and how it looks.
covers = ["bare", "mossy"]
cover_keys = ["painted_shading.growth", "painted_shading.growth_height_m", "painted_shading.growth_up", "painted_shading.growth_edges", "painted_shading.growth_edge_m", "painted_shading.growth_darker", "painted_shading.growth_patch_m"]

[skeleton]
# How a tree's bark is measured: level slices through it. The amounts wanted are in each spec.
breast_height_m = 1.3       # where a trunk's girth and its sides are taken
slice_step_m = 0.1          # between the slices that look for the fork and count branches
side_min_share = 0.06       # an edge of the slice is a flat side when it is this share of the way round
foot_height_m = 0.4         # where a trunk's foot is taken for its lean: just above where the roots have joined it
root_ring_share = 0.5       # roots are told from a plinth on a circle this share of the way from the trunk's girth out to its furthest root tip
max_root_fill = 0.25        # at most this share of that circle is root: three quarters of the way round is ground
root_curve_height = 0.5     # a root's sweep is taken this many times the trunk's radius (at breast height) above the ground slice
max_root_curve = 0.65       # where the foot reaches at most this share as far beyond the trunk as at the ground
max_limb_bend_deg = 16.0    # the sharpest turn between two stretches of a limb, ring to ring: more shows from below as an elbow (the reviewers' were 17 to 21)

[variants]
# Variants are compared by outline, from the four level views, both standing on their origins.
views = ["front", "right", "back", "left"]
view_rays = 96

[log]
# A fallen log (source/log): a trunk lying along x, measured at upright slices across its length (tools/log_checks.py).
# The amounts wanted are in each spec.
stations = 24               # slices, evenly spaced between the two ends left out
end_share = 0.12            # the share of the length left out at each end, where a broken end is not a closed outline; the wood an end shows is measured there
ground_m = 0.01             # a slice touches the ground when its lowest point is this close to the floor of the bounds
max_tilt_deg = 6.0          # the line from the first slice's middle to the last's is within this of level: lying, not leaning
min_long = 3.0              # and the trunk is at least this many times as long as it is thick: a log, not a stump
step_share = 0.04        # a rise or fall of the outline along the trunk counts as a turn when it is more than this share of the thickness
max_turns = 3            # most turns of the outline between the end eighths: a swelling and a lifted stretch, not a step at every ring
min_ragged = 0.5         # a broken end's rim reaches at least this share of the trunk's thickness along the log, or three tenths of the end left out (end_share), whichever is less
max_sawn = 0.3           # and a sawn end's at most this: a flat cut a little off square
