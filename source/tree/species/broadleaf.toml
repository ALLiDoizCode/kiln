# Broadleaf: a species recipe for the tree generator (source/tree/generator.py, source/tree/brief.md).
#
# A species is everything the generator draws from that is not the seed, the size or the growth
# stage: how the trunk leans, flares and forks, where the pads sit and how they are built, and the
# shape of a leaf piece. A spec names its recipe with `species`; a new species is a new file here,
# and a new tree of this one is a new spec. Lengths are metres and angles degrees unless a share
# is named; a pair is a range one value is drawn from per tree (or per pad, lobe or piece).

[trunk]
sides = [6, 7]                 # flat sides, drawn per tree
strip = 0.2                    # the soft-edge strip at a corner, as a share of the angle between corners
breast_radius = [0.19, 0.24]   # at 1.3 m, for a mature tree
fork_height = [0.37, 0.45]     # share of the tree's height at which the lowest branch leaves
top = 0.64                     # radius below the fork over the radius at 1.3 m
lean = [0.38, 0.62]            # how far the fork stands to one side of the foot
bend = [0.07, 0.14]            # how far the trunk bows out of the straight line from foot to fork
roots = [3, 4]                 # corners pulled out into roots
root_reach = [2.3, 3.0]        # a root's tip from the trunk's axis, over the radius there
root_rise = 0.34               # height at which a root has all but joined the trunk
rings = [0.85, 1.6]            # heights of the trunk's two rings between its roots and the stretch below the fork
leader = 0.72                  # radius of the leader just above the fork, over the trunk's just below
tip_radius = 0.035

[branches]
sides = 5
radius = 0.62                  # a branch's radius where it leaves, over its parent's there
rings = 5
start = 0.45                   # how far from its parent's axis a branch begins, over the parent's radius there
fork_spread = 0.55             # branches leave the trunk within this far below the fork
fork_lowest = 2.35             # and none lower than this: above a player's head, with room to spare
twig_radius = 0.04             # a twig runs from the end of a pad's limb into each of its side lobes

[pads]
counts = [[3, 0.3], [4, 0.5], [5, 0.2]]  # (count, how often), drawn per tree
floor = 0.25                   # the lowest a pad's underside hangs, above the fork
fewest = 2                     # however young the tree: a sapling's two tufts
most = 6                       # or old
largest = [1.5, 1.75]          # half the width of a tree's widest pad, before the fit
smallest = [0.8, 0.92]         # and of its narrowest; the rest fall between
clear = 0.15                   # clear air between two pads' surfaces before the fit
reach = 0.15                   # how far leaf tips stand off a pad's surface

[lobes]
# A pad is a few overlapping rounded masses of different sizes.
counts = [[2, 0.25], [3, 0.5], [4, 0.25]]  # (count, how often), drawn per pad
main = [0.7, 0.82]             # the main lobe's radius, over half the pad's width
side = [0.44, 0.56]            # a side lobe's
tall = [0.7, 0.9]              # a lobe's height above its middle, over its radius
under = 0.42                   # and its depth below its middle, over that height: flat underneath
drop = [-0.32, 0.06]           # a side lobe's middle above the main lobe's, over the main lobe's radius
open = -0.3                    # the shell of pieces stops here (unit sphere height); the skirt hangs from there
buried = 0.9                   # a piece is left out when its place is this deep inside another lobe

[core]
# One closed, dark, low-triangle solid inside each lobe (ADR 9 as amended).
size = 0.85                    # the core's size over its lobe's
sides = 6                      # corners round each of its two rings
rough = 0.12                   # how far a ring's corner stands in or out, as a share

[leaf]
spacing = 0.27                 # between neighbouring pieces on a lobe's surface
length = [0.5, 0.75]
width = [0.48, 0.56]           # over the length
lift = [12.0, 40.0]            # degrees a piece is raised off the surface
yaw = 38.0                     # degrees it may swing either side of straight down the surface
roll = 22.0                    # and tip about its own length
foot = 0.8                     # how much of a piece's length lies behind the point where it crosses the lobe's surface
round = 0.4                    # share of a piece's normal taken from the direction out of its lobe
up = 0.3                       # and how far every piece's normal is tipped toward the sky
# One piece, as (along its length, across it), both as shares of the length and the width: the
# foot, a shoulder, a notch and a tooth up one side, the tip, and a shoulder on the other side.
# Half the pieces are mirrored. Four triangles fill it.
outline = [[0.0, 0.0], [0.28, -0.5], [0.47, -0.24], [0.6, -0.38], [1.0, 0.0], [0.38, 0.5]]
triangles = [[0, 1, 2], [2, 3, 4], [0, 2, 4], [0, 4, 5]]

[skirt]
# Pieces hanging from the rim of a lobe, and a few under it, pointing out and down.
spacing = 0.3                  # between neighbouring pieces round the rim
droop = [40.0, 72.0]           # degrees below level
foot = 0.4                     # how much of a skirt piece's length lies behind the rim
drop = 0.45                    # how far the skirt hangs below a lobe's underside
under_spacing = 0.36           # between pieces hanging under a lobe
under_droop = [35.0, 70.0]

[growth]
# A spec's `growth_stage` is the tree's height over a mature tree's: 1.0 is mature. Everything
# above is the mature tree; these say what else changes with the stage, each as a multiplier at
# the stages named in `stage`, read off in straight lines between them. From young to old, leaf pieces
# do not grow; a sapling's are shorter, and it carries two tufts (source/tree/brief.md, Growth stages).
mature_height_m = [6.0, 8.0]   # a mature tree's height; a spec's bounds must be its stage times this
stage     = [0.5, 0.8, 1.0, 1.25]   # sapling, young, mature, old
girth     = [0.5, 0.7, 1.0, 1.3]    # the trunk's radius; roots rise with it, and tips and twigs thin by its square root
lean      = [0.5, 0.88, 1.0, 1.1]   # lean and bend
fork      = [0.74, 0.9, 1.0, 1.0]   # the lowest height a branch leaves at, and how far below the fork branches leave
pad_count = [0.45, 0.85, 1.0, 1.5]  # how many pads, rounded, from `pads.fewest` to `pads.most`
pad_width = [0.5, 0.8, 1.0, 1.15]  # half-widths of the pads
trunk_rings = [0.8125, 1.0, 1.0, 1.0] # `trunk.rings`: a sapling's upper ring is 1.3 m up, where its girth is taken, so that it tapers from there to its fork
pad_floor = [0.0, 1.0, 1.0, 1.0]   # `pads.floor`: below nought a pad may hang past the fork, as a sapling's lower tuft does
leaf      = [0.84, 1.0, 1.0, 1.0]    # a leaf piece's length, the skirt's drop and how far tips stand off a pad
leaf_spacing = [0.72, 1.0, 1.0, 1.0] # the spacing between pieces, on a lobe, round its rim and under it
